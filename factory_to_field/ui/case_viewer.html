<title>Factory to Field Cases</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f4ee;--panel:#fffdf8;--ink:#1d2327;--muted:#5d676d;--line:#dcd7c9;--accent:#0b6e6e;--accent-ink:#fff;--ok:#2f7d46;--bad:#b3362c;--warn:#9a6a00;--chip:#ece8dc;--code:#f0ece0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191c;--panel:#1b2226;--ink:#e8ecee;--muted:#9aa6ac;--line:#2d383e;--accent:#4cc2c2;--accent-ink:#0b1416;--ok:#6fcf8a;--bad:#ff8a7d;--warn:#e5b94e;--chip:#26323a;--code:#222c32;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191c;--panel:#1b2226;--ink:#e8ecee;--muted:#9aa6ac;--line:#2d383e;--accent:#4cc2c2;--accent-ink:#0b1416;--ok:#6fcf8a;--bad:#ff8a7d;--warn:#e5b94e;--chip:#26323a;--code:#222c32;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
h1{font:600 22px/1.2 "IBM Plex Sans",system-ui,sans-serif;margin:0 0 4px}h2{font-size:18px;margin:0 0 6px;text-wrap:balance}h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;max-width:1180px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
nav{display:flex;flex-direction:column;gap:6px}
nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
nav button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
nav .id{font:600 12px ui-monospace,Menlo,monospace;color:var(--muted)}nav .t{grid-column:2;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--ok)}.dot.bad{background:var(--bad)}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.rec{border-left:3px solid var(--accent);padding:6px 12px;background:var(--code);border-radius:0 8px 8px 0}
.f{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 12px;padding:9px 0;border-top:1px solid var(--line)}
@media(max-width:560px){.f{grid-template-columns:1fr}}
.who{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.chips{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}@media(max-width:560px){.chips{grid-column:1}}
.chip{font:11px ui-monospace,Menlo,monospace;background:var(--chip);border-radius:5px;padding:1px 6px;color:var(--muted);overflow-wrap:anywhere}
.flag{border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0;color:var(--ink)}.flag b{color:var(--warn)}
.draft{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}.draft .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
button.act{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:6px 12px;background:var(--accent);color:var(--accent-ink)}button.act:disabled{opacity:.45;cursor:default}
.status{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip)}.status.approved{color:var(--ok)}.status.denied{color:var(--bad)}
.msg{font-size:13px;color:var(--bad);min-height:1.2em}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:4px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.checks li{list-style:none;margin:2px 0}.checks{padding:0;margin:0}.checks .ok::before{content:"✓ ";color:var(--ok)}.checks .no::before{content:"✗ ";color:var(--bad)}
code{font:12px ui-monospace,Menlo,monospace;background:var(--code);padding:1px 5px;border-radius:4px}
</style>

    <h3>Findings</h3>${c.findings.map(f => `<div class="f"><div class="who">${esc(f.who)}</div><div>${esc(f.text)}</div><div class="chips">${ev(f.evidence)}</div></div>`).join("")}
    ${c.drafts.length ? `<h3>Drafts awaiting approval</h3>${c.drafts.map(draftHtml).join("")}` : ""}
    <h3>Audit trail</h3><div class="scroll"><table><tr><th>#</th><th>Tool</th><th>Arguments</th><th>Evidence</th><th></th></tr>${c.calls.map(k => `<tr><td>${k.n}</td><td><code>${esc(k.tool)}</code></td><td>${esc(JSON.stringify(k.args))}</td><td>${k.evidence}</td><td>${k.refused ? "refused" : k.untrusted ? "untrusted text labelled" : ""}</td></tr>`).join("")}</table></div>
    <h3>Scored against the answer key</h3><ul class="checks">${Object.entries(c.checks).map(([k, v]) => `<li class="${v ? "ok" : "no"}">${esc(k)}</li>`).join("")}</ul>`;
  document.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => {
    const box = b.closest(".draft"), id = b.dataset.a, d = c.drafts.find(x => x.id === id);
    const who = box.querySelector('[data-f="who"]').value.trim(), role = box.querySelector('[data-f="role"]').value;
    const m = box.querySelector("[data-m]");
    if (!who) { m.textContent = "Approval needs a named person."; return; }
    if (role !== d.role) { m.textContent = `This kind of draft must be approved by a ${d.role}, not a ${role}.`; state.approvals[id] = {ok: false}; return; }
    state.approvals[id] = {ok: true, who}; render();
  });
}
render();
</script>

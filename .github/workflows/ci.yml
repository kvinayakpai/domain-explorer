name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node — lint + typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4  # version comes from "packageManager" in package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm --filter explorer-web test

  python:
    name: Python — ruff + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: uv sync
        run: uv sync --all-extras --dev

      - name: Install test deps
        run: uv pip install pytest networkx pyarrow faker mimesis

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy services/api/app packages/metadata/python/metadata

      - name: pytest
        run: uv run pytest

  factory-to-field:
    name: Factory to Field — ontology, simulated plant, knowledge graph, agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: factory_to_field/requirements.txt

      - name: Install
        run: pip install -r factory_to_field/requirements.txt ruff

      - name: ruff
        run: ruff check factory_to_field

      - name: Generated ontology artefacts are current
        run: python -m factory_to_field.ontology.build --check

      - name: Diagnose (temporary) world and graph fingerprints
        shell: bash
        continue-on-error: true
        run: |
          python -m factory_to_field.world.build --out /tmp/dw >/dev/null
          w=$(cd /tmp/dw && sha256sum * | awk '{print substr($1,1,8)" "$2}' | tr '\n' ';')
          echo "::notice::world sha: ${w}"
          python -m factory_to_field.kg.build --world /tmp/dw --out /tmp/dk --skip-shacl | tail -1 | sed 's/^/::notice::/'
          python - <<'PY'
          import platform, numpy
          from pathlib import Path
          from factory_to_field.kg.store import KG
          kg = KG(Path("/tmp/dk/store"), read_only=True)
          rows = kg.sparql("PREFIX ftf: <https://domain-explorer.dev/ftf#> SELECT (COUNT(*) AS ?n) WHERE { ?s a ftf:Signal }")
          cw = kg.sparql("PREFIX ftf: <https://domain-explorer.dev/ftf#> SELECT ?s ?o WHERE { ?s ?p ?o . FILTER(CONTAINS(STR(?o), '10P101A.VIB_DE')) } LIMIT 5")
          print(f"::notice::py {platform.python_version()} numpy {numpy.__version__} {platform.machine()} signals={rows} tagrefs={cw}")
          PY
      - name: pytest (world, knowledge graph with SHACL gate, agents)
        shell: bash
        run: |
          set +e
          python -m pytest -c factory_to_field/pytest.ini factory_to_field/tests --tb=short -rfE 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          # surface failures as annotations so they are readable without the raw log
          grep -E "^(FAILED|ERROR) " pytest.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:300}"; done; grep -E "^E  " pytest.log | head -6 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $rc

      - name: Gold cases
        run: |
          python -m factory_to_field.world.build
          python -m factory_to_field.kg.build
          python -m factory_to_field.agents.gold
          python -m factory_to_field.demo

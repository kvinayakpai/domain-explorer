<title>Domain Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: an atlas. A left index of verticals, a main sheet that
   switches between the treemap atlas, a vertical, a subdomain dossier and
   four cross-cutting lenses. Ink on cool survey paper, one ultramarine accent;
   vertical hues are data, not decoration. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#e2e7ec; --ink:#101a26; --ink-2:#465669;
  --line:#c8d1db; --accent:#2437d6; --accent-ink:#ffffff; --accent-soft:#dfe3fb;
  --good:#17744a; --warn:#935d00; --bad:#b3261e;
  --vs:42%; --vl:80%; --cell-ink:#101a26; --cell-off:#dde3ea;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1219; --surface:#131c26; --surface-2:#1a2532; --ink:#e6ecf2; --ink-2:#93a4b8;
    --line:#263445; --accent:#8e9bff; --accent-ink:#0c1219; --accent-soft:#222a55;
    --good:#52c98b; --warn:#e3a94a; --bad:#ff7b72;
    --vs:38%; --vl:30%; --cell-ink:#e6ecf2; --cell-off:#1a2532; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1219; --surface:#131c26; --surface-2:#1a2532; --ink:#e6ecf2; --ink-2:#93a4b8;
  --line:#263445; --accent:#8e9bff; --accent-ink:#0c1219; --accent-soft:#222a55;
  --good:#52c98b; --warn:#e3a94a; --bad:#ff7b72;
  --vs:38%; --vl:30%; --cell-ink:#e6ecf2; --cell-off:#1a2532; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;letter-spacing:-.01em;line-height:1.1;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:.84em}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px var(--gut)}
.brand{font:700 20px/1 var(--f-display);font-stretch:118%;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand i{width:14px;height:14px;border-radius:50%;border:3px solid var(--accent);display:inline-block;box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 7px var(--accent)}
.search{position:relative;flex:1 1 280px;min-width:0;max-width:560px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search input::placeholder{color:var(--ink-2)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;
  max-height:70vh;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px}
#results h4{margin:8px 8px 4px;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
#results button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:6px;cursor:pointer}
#results button[aria-selected="true"],#results button:hover{background:var(--accent-soft)}
#results .where{margin-left:auto;color:var(--ink-2);font-size:12px;white-space:nowrap;padding-left:8px}
#results .empty{padding:14px 10px;color:var(--ink-2)}
.lenses{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.lenses a{padding:7px 12px;border-radius:999px;text-decoration:none;white-space:nowrap;border:1px solid transparent;color:var(--ink-2);font-weight:500}
.lenses a:hover{border-color:var(--line)}
.lenses a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* shell */
.body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0 28px;padding:20px var(--gut) 40px;max-width:1500px;margin:0 auto}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.rail h4{margin:0 0 8px;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rail a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;text-decoration:none;font-size:14px}
.rail a:hover{background:var(--surface-2)}
.rail a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.rail .dot{width:10px;height:10px;border-radius:3px;flex:none;background:hsl(var(--h) var(--vs) var(--vl));outline:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.rail .ct{margin-left:auto;color:var(--ink-2);font-size:12px}
main{min-width:0;outline:none}
.crumbs{font-size:13px;color:var(--ink-2);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 8px}
.crumbs a{text-decoration:none;border-bottom:1px solid var(--line)}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:6px}
h1{font-size:clamp(26px,4.2vw,42px);font-weight:700}
h2{font-size:clamp(19px,2.6vw,25px);font-weight:700;margin-bottom:10px}
h3{font-size:16px;font-weight:700}
.lede{max-width:68ch;color:var(--ink-2);margin:6px 0 0}
.census{display:flex;flex-wrap:wrap;gap:4px 18px;margin:14px 0 4px;padding:0;list-style:none;color:var(--ink-2)}
.census b{color:var(--ink);font-weight:600}
.sec{margin-top:30px}
.row-flex{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}

/* controls */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
select,.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;line-height:1.5;text-decoration:none;white-space:nowrap}
a.chip:hover,button.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.chip.off{color:var(--ink-2);border-style:dashed}
.chip.k{font-family:var(--f-mono);font-size:12px}
.chip{max-width:100%}
.a-card .chip,.stage .chip,.map-panel .chip{white-space:normal;overflow-wrap:anywhere}
.ask-form .inp{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* atlas */
.atlas-wrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px}
#atlas{display:block;width:100%;height:auto}
#atlas .grp{fill:none;stroke:var(--line)}
#atlas .gl{font:700 11px var(--f-display);font-stretch:112%;letter-spacing:.04em;text-transform:uppercase;fill:var(--ink-2);pointer-events:none}
#atlas .cell{fill:hsl(var(--h) var(--vs) var(--vl));stroke:var(--surface);stroke-width:1.5;transition:opacity .15s}
#atlas.by-vertical .cell.shallow{fill-opacity:.38}
#atlas .cell.mark-on{fill:hsl(215 var(--vs) var(--vl))}
#atlas .cell.mark-off{fill:var(--cell-off)}
#atlas a:hover .cell,#atlas a:focus-visible .cell{stroke:var(--ink);stroke-width:2}
#atlas .ct{font:500 11px var(--f-body);fill:var(--cell-ink);pointer-events:none}
#atlas .cs{font:400 10px var(--f-mono);fill:var(--cell-ink);opacity:.75;pointer-events:none}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;max-width:260px;line-height:1.4}
.tip b{display:block;font-size:13.5px;margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend a,.legend span{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;background:hsl(var(--h) var(--vs) var(--vl));outline:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.legend i.off{background:var(--cell-off)}
.legend i.on{background:hsl(215 var(--vs) var(--vl))}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.rank a{text-decoration:none;font-weight:500}
.rank a:hover{color:var(--accent)}
.rank .n{margin-left:auto;color:var(--ink-2);font-size:13px;white-space:nowrap}

/* lists */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:14px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.item:hover{background:var(--surface)}
.item .t{font:700 17px/1.2 var(--f-display);font-stretch:108%}
.item .d{grid-column:1;color:var(--ink-2);max-width:78ch}
.item .m{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12.5px;color:var(--ink-2)}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}

/* subdomain */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:18px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-size:12px;color:var(--ink-2);margin-left:5px}
.panel{padding-top:20px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.ladder h4{margin:0 0 6px;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ladder .p{display:block;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:6px;text-decoration:none;font-size:13.5px;line-height:1.3}
.ladder .p:hover{border-color:var(--accent)}
.ladder .p small{display:block;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--ink-2)} .dl dd{margin:0}
.decision{padding:12px 0;border-bottom:1px solid var(--line)}
.decision p{margin:0 0 8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.kr{cursor:pointer}
tr.kr:hover td{background:var(--surface-2)}
tr.kd td{background:var(--surface-2)}
.dir{font-family:var(--f-mono);white-space:nowrap}
.dir.up{color:var(--good)} .dir.down{color:var(--warn)} .dir.band{color:var(--ink-2)}
.sqltabs{display:flex;gap:6px;margin:12px 0 8px}
pre.sql{margin:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:auto;font:12.5px/1.5 var(--f-mono);max-height:340px;white-space:pre}
.copy{margin-left:auto}
.er-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;align-items:start}
.er{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
.er svg{display:block;width:100%;height:auto}
.er .edge{stroke:var(--ink-2);stroke-width:1.2;opacity:.55;fill:none}
.er .edge.hot{stroke:var(--accent);opacity:1;stroke-width:2}
.er .elab{font:10px var(--f-mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:3}
.er .node rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1.2}
.er .node text{font:500 11.5px var(--f-body);fill:var(--ink);pointer-events:none}
.er .node{cursor:grab}
.er .node.sel rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.er .node.nb rect{stroke:var(--accent)}
.er .node.dim{opacity:.35}
.pk{color:var(--warn);font-weight:700}
.fk{color:var(--accent);font-weight:700}
.note{padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);max-width:70ch}
.stdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.std{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.std a{color:var(--accent);overflow-wrap:anywhere}
.term{padding:10px 0;border-bottom:1px solid var(--line)}
.term b{font-family:var(--f-display);font-stretch:108%}
.split{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:24px;align-items:start}
.pick{max-height:68vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pick button{display:flex;width:100%;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 12px;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--accent-soft)}
.pick button .n{margin-left:auto;color:var(--ink-2);font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:14px 0}
.more{margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
footer{max-width:1500px;margin:0 auto;padding:0 var(--gut) 40px;color:var(--ink-2);font-size:13px}
footer p{max-width:90ch;margin:6px 0}

/* map */
.map-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.map-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#mapc{display:block;width:100%;height:min(74vh,740px);min-height:420px;touch-action:none;cursor:grab;outline-offset:-3px}
#mapc.grabbing{cursor:grabbing}
.map-tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.map-tools button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;padding:0}
.map-tools button:hover{border-color:var(--accent)}
.map-panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;max-height:74vh;overflow:auto;min-width:0}
/* ask */
.ask-form{display:flex;flex-wrap:wrap;gap:8px}
.ask-log{display:flex;flex-direction:column;gap:22px}
.turn{display:flex;flex-direction:column;gap:10px}
.q-bubble{align-self:flex-end;max-width:min(78ch,92%);background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px 12px 2px 12px;padding:8px 13px}
.a-card{align-self:flex-start;width:100%;max-width:860px;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:14px 16px;min-width:0}
.a-tag{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:2px 0 10px}
.a-card .a-tag:not(:first-child){margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.a-sec{margin:0 0 12px;min-width:0;overflow-wrap:anywhere}
/* lineage */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;min-width:0;overflow-wrap:anywhere}
.stage h3{margin-bottom:8px}
@media (min-width:1500px){.stage:not(:last-child)::after{content:"92";position:absolute;right:-17px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:16px;background:var(--bg);line-height:1}}
@media (max-width:900px){
  .map-grid{grid-template-columns:minmax(0,1fr)}
  .map-panel{max-height:none}
  #mapc{height:62vh;min-height:360px}
}
@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr);gap:14px}
  .rail{position:static;max-height:none;overflow:visible;padding:0}
  .rail nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .rail a{border:1px solid var(--line);border-radius:999px;white-space:nowrap;padding:5px 11px}
  .rail h4{display:none}
  .two,.er-grid,.split{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr)}
  .item .m{grid-column:1;grid-row:auto;align-items:flex-start}
  .pill-row{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

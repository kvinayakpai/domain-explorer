</div>
<script>const DATA = /*__DATA__*/;</script>
<script>
(function () {
'use strict';
var D = DATA;
var $ = function (s, r) { return (r || document).querySelector(s); };

/* ---------- tiny DOM helpers (text only, never innerHTML) ---------- */

/* ---------- indexes ---------- */
var VERT = new Map();

var SUB = new Map(D.subs.map(function (s) { return [s.id, s]; }));

var VEND = new Map();
D.subs.forEach(function (s) {

var GL = new Map();
D.glossary.forEach(function (t) { GL.set(t.n.toLowerCase(), t); (t.al || []).forEach(function (a) { if (!GL.has(a.toLowerCase())) GL.set(a.toLowerCase(), t); }); });

var LEVELS = ['C-suite', 'VP', 'Director', 'Manager', 'IC'];

function vcol(vid) { return '--h:' + VERT.get(vid).hue; }

/* ---------- router ---------- */
var state = { view: 'home' }, lastTok = null;

  if (p[0] === 'lens' && ['map', 'ask', 'lineage', 'kpis', 'people', 'systems', 'glossary'].indexOf(p[1]) >= 0) return { view: p[1] };
  return { view: 'home' };
}
function go(tok, extra) {
  var st = parse(tok);
  if (extra) Object.assign(st, extra);
  state = st; lastTok = tok || '';
  try { if (location.hash.replace(/^#/, '') !== lastTok) location.hash = lastTok; } catch (e) {}

}
window.addEventListener('hashchange', function () {

});
document.addEventListener('click', function (ev) {

  var extra = a.getAttribute('data-sel') ? { sel: a.getAttribute('data-sel') } : null;

  go(a.getAttribute('data-go'), extra);

/* ---------- chrome ---------- */

  [['', 'Atlas', ['home', 'vertical', 'sub']], ['lens.map', 'Map', ['map']], ['lens.ask', 'Ask', ['ask']], ['lens.lineage', 'Lineage', ['lineage']], ['lens.kpis', 'KPIs', ['kpis']], ['lens.people', 'People', ['people']],
   ['lens.systems', 'Systems', ['systems']], ['lens.glossary', 'Glossary', ['glossary']]].forEach(function (l) {
    nav.append(link(l[0], l[2].indexOf(state.view) >= 0 ? { 'aria-current': 'page' } : null, l[1]));
  });
}
function renderRail() {
  var nav = $('#rail'); nav.replaceChildren();
  var cur = state.view === 'vertical' ? state.id : state.view === 'sub' ? SUB.get(state.id).v : null;
  D.verticals.forEach(function (v) {

function render() {
  stopMap(); renderLenses(); renderRail();
  var m = $('#main'); m.replaceChildren();
  ({ home: viewHome, vertical: viewVertical, sub: viewSub, map: viewMap, ask: viewAsk, lineage: viewLineage, kpis: viewKpis, people: viewPeople, systems: viewSystems, glossary: viewGlossary })[state.view](m);
  renderFoot();
}
function renderFoot() {
  var f = $('#foot'); f.replaceChildren(
    h('p', { text: 'Built from the repository data files: data/taxonomy (128 subdomains), data/kpis, data/glossary, data/source-systems, data/connectors, data/quality and data/canned-answers.json. Repository snapshot ' + D.commit + '.' }),
    h('p', { text: 'Deeply modelled means a subdomain carries hand-written decisions plus ingestion and integration challenges (' + N_DEEP + ' of ' + D.subs.length + '). Runnable means a synthetic data generator and DDL exist for it (' + N_SYNTH + '). The rest are survey level: personas, KPIs, entities and source systems only.' }));
}

/* ---------- treemap ---------- */
function squarify(items, x, y, w, hh) {
  var out = [], rest = items.slice(), total = rest.reduce(function (a, b) { return a + b.value; }, 0);
  if (!rest.length || total <= 0 || w <= 0 || hh <= 0) return out;
  var sc = w * hh / total; rest.forEach(function (i) { i.area = i.value * sc; });
  var row = [], rx = x, ry = y, rw = w, rh = hh;
  function worst(r, side) {
    var s = r.reduce(function (a, b) { return a + b.area; }, 0);
    var mx = Math.max.apply(null, r.map(function (q) { return q.area; })), mn = Math.min.apply(null, r.map(function (q) { return q.area; }));
    return Math.max(side * side * mx / (s * s), s * s / (side * side * mn));
  }
  function lay(r) {
    var s = r.reduce(function (a, b) { return a + b.area; }, 0);
    if (rw >= rh) { var cw = s / rh, cy = ry; r.forEach(function (q) { var ch = q.area / cw; out.push({ item: q, x: rx, y: cy, w: cw, h: ch }); cy += ch; }); rx += cw; rw -= cw; }

  }

    else { lay(row); row = []; }

}

var atlasSize = 'kpis', atlasColor = 'vertical';
var METRICS = { kpis: ['KPIs', function (s) { return s.kpis.length; }], ents: ['Entities', function (s) { return s.ents.length; }],
  src: ['Systems', function (s) { return s.src.length; }], pers: ['Personas', function (s) { return s.personas.length; }] };

function drawAtlas() {

    var subs = (BYV[v.id] || []).slice().sort(function (a, b) { return metric(b) - metric(a) || cmp(a.name, b.name); });
    return { v: v, subs: subs, value: subs.reduce(function (a, s) { return a + Math.max(metric(s), 0.6); }, 0) };
  }).filter(function (g) { return g.subs.length; }).sort(function (a, b) { return b.value - a.value; });

  squarify(groups.map(function (g) { return { g: g, value: g.value }; }), 0, 0, W, H).forEach(function (o) {

      var s = c.item.s, cls = 'cell';

      a.append(sv('rect', { class: cls, x: c.x, y: c.y, width: Math.max(c.w, 0), height: Math.max(c.h, 0), rx: 2, style: vcol(s.v) }));

      }
      svg.append(a);
    });
  });
  wrap.replaceChildren(svg);
  var tip = $('#tip');
  svg.addEventListener('pointermove', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[data-id]');
    if (!a || ev.pointerType === 'touch') { tip.hidden = true; return; }
    var s = SUB.get(a.getAttribute('data-id'));
    tip.replaceChildren(h('b', { text: s.name }), VERT.get(s.v).label + ' · ' + pl(s.kpis.length, 'KPI') + ', ' + pl(s.ents.length, 'entity', 'entities') + ', ' + pl(s.src.length, 'system'),
      h('div', { text: (s.deep ? 'Deeply modelled' : 'Survey level') + (s.synth ? ' · runnable data' : '') }));
    tip.hidden = false;
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 280) + 'px'; tip.style.top = (ev.clientY + 16) + 'px';
  });
  svg.addEventListener('pointerleave', function () { tip.hidden = true; });
}
function legendFor() {
  var box = h('div', { class: 'legend' });
  if (atlasColor === 'vertical') {
    D.verticals.forEach(function (v) { if ((BYV[v.id] || []).length) box.append(link('v.' + v.id, null, h('i', { style: vcol(v.id) }), VERT.get(v.id).label)); });
    box.append(h('span', { class: 'muted', text: 'Paler cells are survey level.' }));
  } else if (atlasColor === 'depth') {
    box.append(h('span', null, h('i', { class: 'on' }), 'Deeply modelled (' + N_DEEP + ')'), h('span', null, h('i', { class: 'off' }), 'Survey level (' + (D.subs.length - N_DEEP) + ')'));
  } else {
    box.append(h('span', null, h('i', { class: 'on' }), 'Runnable synthetic data and DDL (' + N_SYNTH + ')'), h('span', null, h('i', { class: 'off' }), 'Model only (' + (D.subs.length - N_SYNTH) + ')'));

}

  opts.forEach(function (o) { g.append(h('button', { type: 'button', 'aria-pressed': String(cur === o[0]), onclick: function () { onpick(o[0]); } }, o[1])); });

}

/* ---------- home ---------- */

  items.forEach(function (i) { ul.append(h('li', null, i[0], h('span', { class: 'n num', text: i[1] }))); });

}

  m.append(
    h('div', { class: 'page-h' }, h('h1', { text: 'Industry data domains, end to end' })),
    h('p', { class: 'lede', text: 'Each cell is a subdomain. Open one to see who decides, which KPIs they watch, the entities behind those KPIs and the systems the data comes from.' }),
    h('ul', { class: 'census num' },
      [[nv, 'verticals'], [D.subs.length, 'subdomains'], [ALLK.length, 'KPI entries'], [nEnt, 'entities'], [VEND.size, 'vendors named'], [N_DEEP, 'deeply modelled'], [N_SYNTH, 'with runnable data']]
        .map(function (c) { return h('li', null, h('b', { text: c[0] }), ' ' + c[1]); })),
    h('div', { class: 'row-flex', style: 'margin-top:14px;gap:10px 24px' },
      seg('Size by', Object.keys(METRICS).map(function (k) { return [k, METRICS[k][0]]; }), atlasSize, function (k) { atlasSize = k; drawAtlas(); refreshSegs(); }),
      seg('Color by', [['vertical', 'Vertical'], ['depth', 'Depth'], ['data', 'Runnable data']], atlasColor, function (k) { atlasColor = k; drawAtlas(); refreshLegend(); refreshSegs(); })),
    h('div', { class: 'atlas-wrap', id: 'atlasWrap' }),
    h('div', { id: 'legendBox' }, legendFor()));
  var deep = D.subs.filter(function (s) { return s.deep; }).sort(function (a, b) { return score(b) - score(a); }).slice(0, 8);
  var vend = Array.from(VEND.values()).sort(function (a, b) { return b.subs.size - a.subs.size || cmp(a.name, b.name); }).slice(0, 8);
  var pers = Array.from(PERS.values()).sort(function (a, b) { return b.subs.size - a.subs.size || cmp(a.name, b.name); }).slice(0, 8);
  m.append(h('div', { class: 'sec cols3' },
    h('div', null, h('h2', { text: 'Deepest models' }), topList(deep.map(function (s) { return [link('s.' + s.id, null, s.name), pl(s.kpis.length, 'KPI') + ' · ' + pl(s.ents.length, 'entity', 'entities')]; }))),
    h('div', null, h('h2', { text: 'Most reused systems' }), topList(vend.map(function (v) { return [link('lens.systems', { 'data-sel': v.name }, v.name), pl(v.subs.size, 'subdomain')]; }))),
    h('div', null, h('h2', { text: 'Most common personas' }), topList(pers.map(function (p) { return [link('lens.people', { 'data-sel': p.name }, p.name), pl(p.subs.size, 'subdomain')]; })))));

}
function refreshSegs() { var wrap = $('.row-flex'); if (!wrap) return; /* re-render controls */
  var parent = wrap.parentNode, fresh = h('div', { class: 'row-flex', style: 'margin-top:14px;gap:10px 24px' },
    seg('Size by', Object.keys(METRICS).map(function (k) { return [k, METRICS[k][0]]; }), atlasSize, function (k) { atlasSize = k; drawAtlas(); refreshSegs(); }),
    seg('Color by', [['vertical', 'Vertical'], ['depth', 'Depth'], ['data', 'Runnable data']], atlasColor, function (k) { atlasColor = k; drawAtlas(); refreshLegend(); refreshSegs(); }));

/* ---------- vertical ---------- */
var vFilter = 'all', vSort = 'name';

  if (s.synth) a.push(h('span', { class: 'chip good', text: 'Runnable data' }));

  return a;
}
function viewVertical(m) {
  var v = VERT.get(state.id), list = (BYV[v.id] || []).slice();
  var nk = list.reduce(function (a, s) { return a + s.kpis.length; }, 0), ne = list.reduce(function (a, s) { return a + s.ents.length; }, 0);
  m.append(
    h('div', { class: 'crumbs' }, link('', null, 'Atlas'), ' / ', h('span', { text: v.label })),
    h('div', { class: 'page-h' }, h('h1', { text: v.label })),
    h('p', { class: 'lede', text: v.tag }),
    h('ul', { class: 'census num' }, [[list.length, 'subdomains'], [nk, 'KPI entries'], [ne, 'entities'],
      [list.filter(function (s) { return s.deep; }).length, 'deeply modelled'], [list.filter(function (s) { return s.synth; }).length, 'runnable']]
      .map(function (c) { return h('li', null, h('b', { text: c[0] }), ' ' + c[1]); })));
  var out = h('div');
  function paint() {
    var rows = list.filter(function (s) { return vFilter === 'all' || (vFilter === 'deep' && s.deep) || (vFilter === 'synth' && s.synth); });
    rows.sort(function (a, b) {
      if (vSort === 'name') return cmp(a.name, b.name);
      var f = { kpis: function (s) { return s.kpis.length; }, ents: function (s) { return s.ents.length; }, src: function (s) { return s.src.length; } }[vSort];
      return f(b) - f(a) || cmp(a.name, b.name);
    });
    var box = h('div', { class: 'list' });
    if (!rows.length) box.append(h('p', { class: 'note', style: 'margin-top:14px', text: 'No subdomains in this vertical match that filter.' }));
    rows.forEach(function (s) {
      box.append(link('s.' + s.id, { class: 'item' }, h('div', { class: 't', text: s.name }), h('div', { class: 'd', text: s.one }),
        h('div', { class: 'm' }, h('div', { class: 'pill-row' }, badges(s)), h('div', { class: 'num', text: pl(s.kpis.length, 'KPI') + ' · ' + pl(s.ents.length, 'entity', 'entities') + ' · ' + pl(s.src.length, 'system') }))));
    });

  var filt = h('div', { class: 'filters' });

    filt.replaceChildren(seg('Show', [['all', 'All'], ['deep', 'Deeply modelled'], ['synth', 'Runnable data']], vFilter, function (k) { vFilter = k; paintFilt(); paint(); }),
      h('label', { class: 'ctl', for: 'vsort' }, 'Sort', fsel));
  }
  paintFilt(); m.append(filt, out); paint();
}

/* ---------- subdomain ---------- */
var sqlStyle = 'threeNF';
function viewSub(m) {
  var s = SUB.get(state.id), v = VERT.get(s.v);
